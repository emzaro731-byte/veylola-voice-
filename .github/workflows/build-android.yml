name: Build Veylola Voice APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.veylola --project-name veylola_voice .
      - name: Configure Android background voice service
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MICROPHONE",
              "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS",
          ]
          for permission in permissions:
              line = f'<uses-permission android:name="{permission}" />'
              if line not in s:
                  s = s.replace("<application", f"    {line}\n    <application", 1)
          service = '    <service android:name=".WakeWordService" android:exported="false" android:foregroundServiceType="microphone" />'
          accessibility_service = '''    <service
                      android:name=".VeylolaAccessibilityService"
                      android:label="Veylola Voice"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/veylola_accessibility_service" />
                  </service>'''
          if 'android:name=".WakeWordService"' not in s:
              s = s.replace("</application>", service + "\n</application>")
          if 'android:name=".VeylolaAccessibilityService"' not in s:
              s = s.replace("</application>", accessibility_service + "\n</application>")
          p.write_text(s)
          config = Path("android/app/src/main/res/xml/veylola_accessibility_service.xml")
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/veylola_accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:canPerformGestures="false" />
          """.lstrip())
          strings = Path("android/app/src/main/res/values/strings.xml")
          st = strings.read_text()
          entry = '<string name="veylola_accessibility_description">Optional Veylola Voice accessibility service. Enable manually in Android Settings. This starter service does not read screen content or perform gestures.</string>'
          if 'name="veylola_accessibility_description"' not in st:
              st = st.replace("</resources>", f"    {entry}\n</resources>")
          strings.write_text(st)
          PY
          mkdir -p android/app/src/main/kotlin/com/veylola/veylola_voice
          cat > android/app/src/main/kotlin/com/veylola/veylola_voice/MainActivity.kt <<'EOF'
          package com.veylola.veylola_voice
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.veylola.veylola_voice/background").setMethodCallHandler { call, result ->
                try {
                  when (call.method) {
                    "start" -> {
                      val intent = Intent(this, WakeWordService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                      result.success(true)
                    }
                    "stop" -> { stopService(Intent(this, WakeWordService::class.java)); result.success(true) }
                    "batterySettings" -> {
                      val request = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + packageName))
                      try { startActivity(request) }
                      catch (_: Exception) { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) }
                      result.success(true)
                    }
                    "appSettings" -> {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + packageName)))
                      result.success(true)
                    }
                    "accessibilitySettings" -> {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      result.success(true)
                    }
                    else -> result.notImplemented()
                  }
                } catch (e: Exception) { result.error("ANDROID_ACTION_FAILED", e.message, null) }
              }
            }
          }
          EOF
          cat > android/app/src/main/kotlin/com/veylola/veylola_voice/VeylolaAccessibilityService.kt <<'EOF'
          package com.veylola.veylola_voice
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          /**
           * Minimal opt-in accessibility-service scaffold.
           * It intentionally does not inspect screen text, click controls, or perform gestures.
           */
          class VeylolaAccessibilityService : AccessibilityService() {
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
              // Reserved for explicitly user-requested accessibility features.
            }
            override fun onInterrupt() {
              // Nothing to interrupt in this minimal scaffold.
            }
          }
          EOF
          cat > android/app/src/main/kotlin/com/veylola/veylola_voice/WakeWordService.kt <<'EOF'
          package com.veylola.veylola_voice
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import java.util.Locale
          class WakeWordService : Service(), RecognitionListener {
            private var recognizer: SpeechRecognizer? = null
            private val handler = Handler(Looper.getMainLooper())
            private var stopped = false
            private var retryCount = 0
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
            override fun onCreate() {
              super.onCreate()
              val manager = getSystemService(NotificationManager::class.java)
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) manager.createNotificationChannel(
                NotificationChannel("veylola_voice", "Veylola background voice", NotificationManager.IMPORTANCE_LOW).apply { description = "Shows when Veylola background listening is enabled" })
              startForegroundCompat(buildNotification("Veylola Voice is active", "Wake-word listening is enabled. Tap to open the app."))
              startRecognition()
            }
            private fun startForegroundCompat(notification: Notification) {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                startForeground(2407, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
              } else startForeground(2407, notification)
            }
            private fun buildNotification(title: String, text: String): Notification {
              val open = PendingIntent.getActivity(this, 0,
                Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP),
                PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0)
              return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                Notification.Builder(this, "veylola_voice").setContentTitle(title).setContentText(text)
                  .setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(open).setOngoing(true).build()
              else Notification.Builder(this).setContentTitle(title).setContentText(text)
                .setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(open).setOngoing(true).build()
            }
            private fun startRecognition() {
              if (stopped) return
              if (!SpeechRecognizer.isRecognitionAvailable(this)) { scheduleRetry(); return }
              try {
                recognizer?.destroy()
                recognizer = SpeechRecognizer.createSpeechRecognizer(this).also { it.setRecognitionListener(this) }
                val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-NG")
                  putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                }
                recognizer?.startListening(intent)
              } catch (_: Exception) { scheduleRetry() }
            }
            private fun scheduleRetry() {
              if (stopped) return
              retryCount = (retryCount + 1).coerceAtMost(10)
              handler.removeCallbacksAndMessages(null)
              handler.postDelayed({ startRecognition() }, (retryCount * 1200L).coerceAtMost(15000L))
            }
            private fun handleMatches(results: Bundle?) {
              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
              val heardWakeWord = matches.any {
                val spoken = it.lowercase(Locale.ROOT)
                spoken.contains("hey veylola") || spoken.contains("hey vey")
              }
              if (heardWakeWord) {
                retryCount = 0
                getSystemService(NotificationManager::class.java).notify(2407,
                  buildNotification("Veylola heard you", "Tap this notification to bring Veylola to the screen."))
                try { recognizer?.cancel() } catch (_: Exception) {}
                handler.postDelayed({ startRecognition() }, 2200)
              } else scheduleRetry()
            }
            override fun onResults(results: Bundle?) = handleMatches(results)
            override fun onPartialResults(results: Bundle?) {
              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
              if (matches.any { val s = it.lowercase(Locale.ROOT); s.contains("hey veylola") || s.contains("hey vey") }) {
                getSystemService(NotificationManager::class.java).notify(2407,
                  buildNotification("Veylola heard you", "Tap this notification to bring Veylola to the screen."))
                try { recognizer?.cancel() } catch (_: Exception) {}
                handler.postDelayed({ startRecognition() }, 2200)
              }
            }
            override fun onReadyForSpeech(params: Bundle?) {}
            override fun onBeginningOfSpeech() {}
            override fun onRmsChanged(rmsdB: Float) {}
            override fun onBufferReceived(buffer: ByteArray?) {}
            override fun onEndOfSpeech() { scheduleRetry() }
            override fun onError(error: Int) { scheduleRetry() }
            override fun onEvent(eventType: Int, params: Bundle?) {}
            override fun onDestroy() {
              stopped = true
              handler.removeCallbacksAndMessages(null)
              try { recognizer?.cancel() } catch (_: Exception) {}
              recognizer?.destroy()
              recognizer = null
              super.onDestroy()
            }
            override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylola-voice-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
