name: Build Veylola Voice APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.veylola --project-name veylola_voice .
      - name: Add Android permissions
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
      - name: Install Android foreground voice service
        run: |
          mkdir -p android/app/src/main/kotlin/com/veylola/veylola_voice
          cat > android/app/src/main/kotlin/com/veylola/veylola_voice/MainActivity.kt <<'EOF'
          package com.veylola.veylola_voice
          import android.content.Intent
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.veylola.veylola_voice/background").setMethodCallHandler { call, result ->
                when (call.method) {
                  "start" -> {
                    val intent = Intent(this, WakeWordService::class.java)
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                    result.success(true)
                  }
                  "stop" -> { stopService(Intent(this, WakeWordService::class.java)); result.success(true) }
                  else -> result.notImplemented()
                }
              }
            }
          }
          EOF
          cat > android/app/src/main/kotlin/com/veylola/veylola_voice/WakeWordService.kt <<'EOF'
          package com.veylola.veylola_voice
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import java.util.Locale
          class WakeWordService : Service(), RecognitionListener {
            private var recognizer: SpeechRecognizer? = null
            private val handler = Handler(Looper.getMainLooper())
            private var stopped = false
            override fun onCreate() {
              super.onCreate()
              val manager = getSystemService(NotificationManager::class.java)
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) manager.createNotificationChannel(
                NotificationChannel("veylola_voice", "Veylola background voice", NotificationManager.IMPORTANCE_LOW).apply { description = "Keeps Veylola voice wake mode active" })
              val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= 23) PendingIntent.FLAG_IMMUTABLE else 0)
              val notification: Notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, "veylola_voice").setContentTitle("Veylola Voice is active").setContentText("Wake-word mode is enabled. Tap to return to Veylola.").setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(open).setOngoing(true).build() else Notification.Builder(this).setContentTitle("Veylola Voice is active").setContentText("Wake-word mode is enabled").setSmallIcon(android.R.drawable.ic_btn_speak_now).setContentIntent(open).setOngoing(true).build()
              startForeground(2407, notification)
              startRecognition()
            }
            private fun startRecognition() {
              if (stopped || !SpeechRecognizer.isRecognitionAvailable(this)) return
              try {
                recognizer?.destroy()
                recognizer = SpeechRecognizer.createSpeechRecognizer(this).also { it.setRecognitionListener(this) }
                val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-NG")
                  putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                }
                recognizer?.startListening(intent)
              } catch (_: Exception) { scheduleRetry() }
            }
            private fun scheduleRetry() { if (!stopped) handler.postDelayed({ startRecognition() }, 1200) }
            override fun onResults(results: Bundle?) {
              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
              if (matches.any { it.lowercase(Locale.ROOT).contains("hey veylola") || it.lowercase(Locale.ROOT).contains("hey vey") }) {
                val launch = Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                startActivity(launch)
                stopRecognition()
                handler.postDelayed({ if (!stopped) startRecognition() }, 5000)
              } else scheduleRetry()
            }
            override fun onPartialResults(results: Bundle?) {
              val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION).orEmpty()
              if (matches.any { it.lowercase(Locale.ROOT).contains("hey veylola") || it.lowercase(Locale.ROOT).contains("hey vey") }) {
                startActivity(Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP))
                stopRecognition()
                handler.postDelayed({ if (!stopped) startRecognition() }, 5000)
              }
            }
            private fun stopRecognition() { try { recognizer?.stopListening() } catch (_: Exception) {} }
            override fun onReadyForSpeech(params: Bundle?) {}
            override fun onBeginningOfSpeech() {}
            override fun onRmsChanged(rmsdB: Float) {}
            override fun onBufferReceived(buffer: ByteArray?) {}
            override fun onEndOfSpeech() { scheduleRetry() }
            override fun onError(error: Int) { scheduleRetry() }
            override fun onEvent(eventType: Int, params: Bundle?) {}
            override fun onDestroy() { stopped = true; handler.removeCallbacksAndMessages(null); recognizer?.destroy(); recognizer = null; super.onDestroy() }
            override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('<uses-permission android:name="android.permission.RECORD_AUDIO" />', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />')
          s=s.replace('<application', '<application')
          s=s.replace('</application>', '    <service android:name=".WakeWordService" android:exported="false" android:foregroundServiceType="microphone" />\\n    </application>')
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: veylola-voice-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
